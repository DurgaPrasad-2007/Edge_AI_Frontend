<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background glow / container -->
    <radialGradient id="edgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Node 1: Top link gradient (Electrified Cobalt) -->
    <linearGradient id="edgeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Node 2: Bottom-Right node gradient (Slate Steel) -->
    <linearGradient id="edgeSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Node 3: Bottom-Left node gradient (Dark Titanium) -->
    <linearGradient id="edgeTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Core pulse gradient -->
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- High-contrast rounded badge background for pristine visibility on both dark & light browser tabs -->
  <rect width="64" height="64" rx="14" fill="url(#edgeGlow)" />
  <rect width="64" height="64" rx="14" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Outer Isometric Hexagonal Chassis -->
  <polygon
    points="32,6 56,19.5 56,44.5 32,58 8,44.5 8,19.5"
    stroke="#60a5fa"
    stroke-width="1.8"
    stroke-opacity="0.4"
    fill="#090d16"
  />

  <!-- Node 1: Top-Front Peer AMR Link -->
  <path
    d="M32,9.5 L53,21 L43,26.5 L32,20.5 L21,26.5 L11,21 Z"
    fill="url(#edgeAccent)"
  />

  <!-- Node 2: Bottom-Right Peer AMR Link -->
  <path
    d="M53,24.5 V42.5 L33.5,53.5 V42.5 L43,37 L53,24.5 Z"
    fill="url(#edgeSteel)"
  />

  <!-- Node 3: Bottom-Left Peer AMR Link -->
  <path
    d="M11,24.5 L21,37 L30.5,42.5 V53.5 L11,42.5 Z"
    fill="url(#edgeTitanium)"
  />

  <!-- Interior Interconnect Geometry / Bus Lines -->
  <line x1="32" y1="20.5" x2="32" y2="32" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />
  <line x1="43" y1="37" x2="32" y2="32" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />
  <line x1="21" y1="37" x2="32" y2="32" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Central Autonomous Mutex Consensus Core -->
  <circle cx="32" cy="32" r="9" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 2" stroke-opacity="0.8" />
  <circle cx="32" cy="32" r="5" fill="url(#coreGlow)" filter="url(#glow)" />
  <circle cx="32" cy="32" r="2.2" fill="#ffffff" />
</svg>
